<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1280px; height: 800px;
    background: linear-gradient(135deg, #6366f1 0%, #4f46e5 50%, #3730a3 100%);
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  .layout { display: flex; align-items: center; gap: 60px; }
  .text-side { color: #fff; max-width: 440px; }
  .text-side h1 { font-size: 42px; font-weight: 800; line-height: 1.15; margin-bottom: 16px; }
  .text-side p { font-size: 18px; opacity: 0.85; line-height: 1.6; }
  .popup {
    width: 360px; background: #fafafa; border-radius: 16px;
    box-shadow: 0 24px 80px rgba(0,0,0,0.35); overflow: hidden;
  }
  .popup-header { text-align: center; padding: 20px 20px 12px; }
  .popup-logo { font-size: 20px; font-weight: 700; color: #1a1a2e; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .popup-logo img { width: 24px; height: 24px; border-radius: 5px; }
  .popup-sub { font-size: 12px; color: #666; margin-top: 4px; }
  .popup-body { padding: 0 20px 20px; }
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 11px; font-weight: 600; color: #444; margin-bottom: 3px; }
  .field input, .field textarea {
    width: 100%; padding: 7px 10px; border: 1px solid #ddd; border-radius: 6px;
    font-size: 13px; background: #fff; color: #1a1a2e; font-family: inherit;
  }
  .field textarea { resize: none; }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }
  .btn-primary {
    display: block; width: 100%; padding: 10px; background: #4361ee; color: #fff;
    border: none; border-radius: 8px; font-size: 14px; font-weight: 600; margin-top: 4px;
  }
  .btn-secondary {
    display: block; width: 100%; padding: 10px; background: #e9ecef; color: #444;
    border: none; border-radius: 8px; font-size: 14px; font-weight: 600; margin-top: 8px;
  }
  .badge {
    position: absolute; top: -4px; right: -4px; background: #4361ee; color: #fff;
    font-size: 10px; font-weight: 700; width: 18px; height: 18px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
</style>
</head>
<body>
<div class="layout">
  <div class="text-side">
    <h1>Save any job posting in one click</h1>
    <p>AI instantly extracts title, company, salary, and description from any job page. Just click and save.</p>
  </div>
  <div class="popup">
    <div class="popup-header">
      <div class="popup-logo">
        <img src="../icons/icon48.png" alt="">Jobber
      </div>
      <div class="popup-sub">Review parsed data</div>
    </div>
    <div class="popup-body">
      <div class="field">
        <label>Job Title</label>
        <input value="Senior Backend Engineer" readonly>
      </div>
      <div class="field">
        <label>Company</label>
        <input value="Stripe" readonly>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Salary</label>
          <input value="$180k - $250k" readonly>
        </div>
        <div class="field">
          <label>Location</label>
          <input value="Remote (US)" readonly>
        </div>
      </div>
      <div class="field">
        <label>Source</label>
        <input value="LinkedIn" readonly>
      </div>
      <div class="field">
        <label>Description</label>
        <textarea rows="3" readonly>We're looking for a Senior Backend Engineer to help build the next generation of payment infrastructure. You'll work on distributed systems processing millions of transactions...</textarea>
      </div>
      <button class="btn-primary">Save to Jobber</button>
      <button class="btn-secondary">Back</button>
    </div>
  </div>
</div>
</body>
</html>

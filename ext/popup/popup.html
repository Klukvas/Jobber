<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=380, initial-scale=1.0" />
    <title>Jobber</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <!-- Login View -->
    <div id="view-login" class="view">
      <div class="header">
        <div class="logo"><img src="../icons/icon48.png" alt="" class="logo-icon" />Jobber</div>
        <p class="subtitle">Sign in to import jobs</p>
      </div>
      <form id="login-form">
        <div class="field">
          <label for="login-email">Email</label>
          <input
            type="email"
            id="login-email"
            placeholder="you@example.com"
            required
          />
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <div class="input-password">
            <input
              type="password"
              id="login-password"
              placeholder="Password"
              required
            />
            <button type="button" class="btn-eye" id="btn-toggle-password" title="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary" id="btn-login">
          Sign In
        </button>
        <div id="login-error" class="error hidden"></div>
      </form>
    </div>

    <!-- Idle View (logged in, ready to parse) -->
    <div id="view-idle" class="view hidden">
      <div class="header">
        <div class="logo"><img src="../icons/icon48.png" alt="" class="logo-icon" />Jobber</div>
        <p class="subtitle" id="current-url"></p>
      </div>
      <div id="idle-error" class="error hidden"></div>
      <button class="btn btn-primary" id="btn-parse">Import This Job</button>
      <button class="btn btn-link" id="btn-logout">Sign Out</button>
    </div>

    <!-- Loading View -->
    <div id="view-loading" class="view hidden">
      <div class="header">
        <div class="logo"><img src="../icons/icon48.png" alt="" class="logo-icon" />Jobber</div>
        <p class="subtitle">Parsing job posting&#x2026;</p>
      </div>
      <div class="spinner"></div>
    </div>

    <!-- Preview View -->
    <div id="view-preview" class="view hidden">
      <div class="header">
        <div class="logo"><img src="../icons/icon48.png" alt="" class="logo-icon" />Jobber</div>
        <p class="subtitle">Review parsed data</p>
      </div>
      <form id="save-form">
        <div class="field">
          <label for="preview-title">Job Title</label>
          <input type="text" id="preview-title" required />
        </div>
        <div class="field">
          <label for="preview-company">Company</label>
          <input type="text" id="preview-company" />
        </div>
        <div class="field-row">
          <div class="field">
            <label for="preview-salary">Salary</label>
            <input
              type="text"
              id="preview-salary"
              placeholder="e.g. $120k-$150k"
            />
          </div>
          <div class="field">
            <label for="preview-location">Location</label>
            <input
              type="text"
              id="preview-location"
              placeholder="e.g. Remote"
            />
          </div>
        </div>
        <div class="field">
          <label for="preview-source">Source</label>
          <input type="text" id="preview-source" />
        </div>
        <div class="field">
          <label for="preview-url">URL</label>
          <input type="url" id="preview-url" />
        </div>
        <div class="field">
          <label for="preview-notes">Description</label>
          <textarea id="preview-notes" rows="8"></textarea>
        </div>
        <button type="submit" class="btn btn-primary" id="btn-save">
          Save to Jobber
        </button>
        <button type="button" class="btn btn-secondary" id="btn-back">
          Back
        </button>
        <div id="duplicate-warning" class="warning hidden">
          This job URL was already imported.
        </div>
        <div id="save-error" class="error hidden"></div>
      </form>
    </div>

    <!-- Success View -->
    <div id="view-success" class="view hidden">
      <div class="header">
        <div class="logo"><img src="../icons/icon48.png" alt="" class="logo-icon" />Jobber</div>
      </div>
      <div class="success-icon">&#x2705;</div>
      <p class="success-text">Job saved successfully!</p>
      <p class="success-title" id="success-job-title"></p>

      <!-- Match Score -->
      <div id="match-section" class="match-section">
        <div id="match-idle">
          <div class="field">
            <select id="match-resume">
              <option value="">Select resume for match&hellip;</option>
            </select>
            <p class="field-hint" id="match-hint"></p>
          </div>
          <button class="btn btn-match" id="btn-check-match">
            Check Match Score
          </button>
          <div id="match-error" class="error hidden"></div>
        </div>
        <div id="match-loading" class="hidden">
          <div class="spinner-small"></div>
          <span class="loading-label">Analyzing&hellip;</span>
        </div>
        <div id="match-result" class="hidden">
          <div class="match-header">
            <div class="match-score-ring" id="match-ring">
              <span class="match-score-num" id="match-score-value">0</span>
              <span class="match-score-pct">%</span>
            </div>
            <div class="match-summary" id="match-summary"></div>
          </div>
          <div class="match-missing" id="match-missing"></div>
        </div>
      </div>

      <button class="btn btn-primary" id="btn-open-in-jobber">
        Open in Jobber
      </button>
      <button class="btn btn-secondary" id="btn-save-another">
        Save Another
      </button>
      <button class="btn btn-link" id="btn-done">Done</button>
    </div>

    <script src="../shared/api.js"></script>
    <script src="popup.js"></script>
  </body>
</html>

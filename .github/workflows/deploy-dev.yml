################################################################################
# GitHub Actions Workflow: Deploy DEV Environment
################################################################################
#
# Purpose:
#   Build and deploy frontend/backend Docker images to a single Hetzner VM
#   using Docker Hub as the container registry and Docker Compose for orchestration.
#
# Key Design Principles:
#
#   1. PATH-BASED DEPLOYMENT
#      - Only build/push images for services that changed
#      - Changes in `be/**` → build backend only
#      - Changes in `fe/**` → build frontend only
#      - Changes in shared files (docker-compose.yml, this workflow) → build both
#      - This reduces build time and Docker Hub bandwidth usage
#
#   2. RUNTIME SECRETS SAFETY
#      - The `.env` file on the server contains ALL runtime secrets
#      - GitHub Actions NEVER creates, modifies, or overwrites this file;
#        it is provisioned and updated by hand on the server
#      - No application secrets appear in GitHub Actions logs
#      - GitHub Secrets are used for CI/CD operations (Docker Hub, SSH, the Sentry
#        upload token) — nothing server-side reads them. The VITE_* values compiled
#        into the public bundle are not secret, so they live in GitHub Variables
#
#   3. DATA PERSISTENCE
#      - Named volumes (postgres_data, redis_data) persist across deployments
#      - `docker compose up -d` safely recreates containers WITHOUT removing volumes
#      - NEVER run `docker compose down -v` in automation (destroys data!)
#      - Volumes survive container removal and are reattached to new containers
#
#   4. IMMUTABLE IMAGE TAGGING
#      - Every image is tagged with commit SHA (e.g., `andreypavlenko/jobber-backend:abc123`)
#      - Optional `dev` tag for convenience (e.g., `andreypavlenko/jobber-backend:dev`)
#      - Rollback: Re-run workflow on a previous commit to deploy that SHA. A commit whose newest
#        migration is below the live schema is refused before anything stops (schema_ahead_of_release).
#      - Never rely on `latest` tag only
#
#   5. PUSH-BASED DEPLOYMENT
#      - GitHub Actions builds, pushes, then SSHs into server
#      - Server pulls new images and restarts containers
#      - Simple, auditable, works for single-server deployments
#
################################################################################

name: Deploy DEV Environment

on:
  push:
    branches:
      - dev          # Trigger on push to dev branch
      - main         # Optional: also deploy from main
  workflow_dispatch: # Allow manual trigger for rollbacks or testing
    inputs:
      # A service is normally built only when its own files changed in the push.
      # That leaves one gap: a build is also held back when *another* service's
      # tests fail, and the next push — which fixes only that other service —
      # detects no change for the held-back one. Its image then quietly stays on
      # the stale `dev` tag while the tested code sits in main. These force the
      # rebuild without an empty commit.
      force_backend:
        description: "Rebuild and deploy the backend even if be/** did not change"
        type: boolean
        default: false
      force_frontend:
        description: "Rebuild and deploy the frontend even if fe/** did not change"
        type: boolean
        default: false

# Prevent concurrent deployments to the same environment
concurrency:
  group: jobber-production
  cancel-in-progress: false  # Don't cancel running deployments

# Environment variables used across all jobs
env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  REGISTRY: docker.io
  BACKEND_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/jobber-backend
  FRONTEND_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/jobber-frontend

jobs:
  ############################################################################
  # Job 1: Detect Changes
  # Uses path filters to determine which services need rebuilding
  ############################################################################
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    
    # Outputs used by downstream jobs to conditionally build/deploy
    outputs:
      backend: ${{ steps.decide.outputs.backend }}
      frontend: ${{ steps.decide.outputs.frontend }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # This workflow file is itself part of a release: it carries the release
      # preflight, the payments pins and the deploy script. A change to it must
      # therefore test and build BOTH services, so the whole release runs at one
      # immutable SHA. Without it the untouched service is deployed from the
      # mutable `dev` tag instead — whatever was last pushed there.
      - name: Check for path-based changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'be/**'
              - 'docker-compose.yml'
              - '.github/workflows/deploy-dev.yml'
              - '.github/scripts/release*'
            frontend:
              - 'fe/**'
              - 'docker-compose.yml'
              - 'Caddyfile'
              - '.github/workflows/deploy-dev.yml'
              - '.github/scripts/release*'
      
      # What the rest of the run acts on: the path filter, widened by a manual
      # force. Everything downstream reads these outputs, so a forced service
      # still runs its full test gate before anything is built or deployed.
      - name: Decide which services to build
        id: decide
        env:
          FILTERED_BACKEND: ${{ steps.filter.outputs.backend }}
          FILTERED_FRONTEND: ${{ steps.filter.outputs.frontend }}
          FORCED_BACKEND: ${{ inputs.force_backend }}
          FORCED_FRONTEND: ${{ inputs.force_frontend }}
        run: |
          backend="$FILTERED_BACKEND"
          frontend="$FILTERED_FRONTEND"
          [ "$FORCED_BACKEND" = "true" ] && backend=true
          [ "$FORCED_FRONTEND" = "true" ] && frontend=true

          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"

          echo "Backend changed: $FILTERED_BACKEND, forced: $FORCED_BACKEND -> build: $backend"
          echo "Frontend changed: $FILTERED_FRONTEND, forced: $FORCED_FRONTEND -> build: $frontend"

  ############################################################################
  # Job 2: Run Backend Unit Tests
  # Only runs if backend code changed
  ############################################################################
  test-backend:
    name: Run Backend Tests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify release recovery protocol
        run: python3 .github/scripts/release-test.py

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: be/go.sum

      - name: Download dependencies
        working-directory: ./be
        run: go mod download

      - name: Run unit tests
        working-directory: ./be
        run: |
          echo "🧪 Running unit tests..."
          go test -v -race -coverprofile=coverage.out ./...

          echo ""
          echo "📊 Coverage Summary:"
          go tool cover -func=coverage.out | tail -1

      - name: Enforce coverage threshold
        working-directory: ./be
        run: |
          THRESHOLD=55
          COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          if [ -z "$COVERAGE" ]; then
            echo "::error::Could not parse coverage from coverage.out"
            exit 1
          fi
          echo "Total coverage: ${COVERAGE}% (threshold: ${THRESHOLD}%)"
          if awk "BEGIN {exit !($COVERAGE < $THRESHOLD)}"; then
            echo "::error::Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            exit 1
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: be/coverage.out
          retention-days: 7

  ############################################################################
  # Job 2b: Run Backend Integration Tests
  # Exercises the real HTTP API against a testcontainers Postgres migrated to the
  # latest schema (+ Redis). Guards cross-module DB queries that unit tests miss —
  # e.g. the single-pipeline finalize dropped jobs.status and 500'd the job-limit
  # and company-count queries; these tests would have caught it before prod.
  # Only runs if backend code changed. Requires Docker (available on GH runners).
  ############################################################################
  test-integration:
    name: Run Backend Integration Tests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: be/go.sum

      - name: Download dependencies
        working-directory: ./be
        run: go mod download

      # testcontainers pulls postgres, redis and the ryuk reaper from Docker Hub.
      # Anonymous pulls share one IP-wide rate limit on hosted runners — that is
      # what failed run 37991986726 while every other gate was green. Logging in
      # with the same credentials the build jobs already use lifts the limit:
      # the action writes ~/.docker/config.json, which testcontainers reads to
      # authenticate its pulls. Nothing about the auth is printed.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run integration tests (testcontainers)
        working-directory: ./be
        run: |
          echo "🧪 Running integration tests against a real migrated Postgres + Redis..."
          go test -race -tags integration -run Integration ./tests/e2e/...

      - name: Verify contacts against isolated PostgreSQL 15
        working-directory: ./be
        run: |
          set -euo pipefail
          docker run -d --name jobber-contacts-ci -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=contacts_test -p 127.0.0.1:55492:5432 postgres:15-alpine
          trap 'docker stop -t 10 jobber-contacts-ci >/dev/null' EXIT
          ready=false
          for ((attempt=0;attempt<60;attempt++)); do
            if docker exec jobber-contacts-ci pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          CONTACTS_TEST_DATABASE_URL='postgres://postgres@127.0.0.1:55492/contacts_test?sslmode=disable' go test -race -tags integration -v ./modules/contacts

      - name: Verify PDF tailoring against isolated PostgreSQL 15
        working-directory: ./be
        run: |
          set -euo pipefail
          docker run -d --name jobber-tailoring-ci -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_USER=jobber -e POSTGRES_DB=jobber_builder_verify -p 127.0.0.1:55493:5432 postgres:15-alpine
          trap 'docker stop -t 10 jobber-tailoring-ci >/dev/null' EXIT
          ready=false
          for ((attempt=0;attempt<60;attempt++)); do
            if docker exec jobber-tailoring-ci pg_isready -h 127.0.0.1 -U jobber >/dev/null 2>&1; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          for migration in migrations/*.up.sql; do
            docker exec -i jobber-tailoring-ci psql -X -q -v ON_ERROR_STOP=1 -U jobber -d jobber_builder_verify < "$migration"
          done
          TAILORING_TEST_DATABASE_URL='postgres://jobber@127.0.0.1:55493/jobber_builder_verify?sslmode=disable' go test -race -tags integration -run 'TestPDFWorkflow|TestWorkflowObject|TestTailoringPostgres' -count=1 -v ./modules/resumebuilder/service

  ############################################################################
  # Job 3: Lint & Build Frontend
  # Only runs if frontend code changed
  ############################################################################
  test-frontend:
    name: Lint & Build Frontend
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@klukvas'
          cache: 'npm'
          cache-dependency-path: fe/package-lock.json

      - name: Install dependencies
        working-directory: ./fe
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run ESLint
        working-directory: ./fe
        run: |
          echo "🔍 Running ESLint..."
          npm run lint

      - name: Run TypeScript check
        working-directory: ./fe
        run: |
          echo "📝 Running TypeScript type check..."
          npx tsc --noEmit

      - name: Run tests with coverage & enforce threshold
        working-directory: ./fe
        run: |
          echo "🧪 Running frontend tests..."
          THRESHOLD=55
          # Run the suite exactly once; capture output for both the log and coverage parsing.
          set -o pipefail
          npx vitest run --coverage 2>&1 | tee vitest-output.txt
          # Match the coverage summary line ("Statements   : 57.2% ( ... )") tolerant to
          # leading whitespace; empty result trips the guard below (safe fail, not silent pass).
          COVERAGE=$(grep -iE '^[[:space:]]*Statements[[:space:]]*:' vitest-output.txt | head -1 | grep -oE '[0-9]+(\.[0-9]+)?' | head -1)
          if [ -z "$COVERAGE" ]; then
            echo "::error::Could not parse frontend coverage"
            exit 1
          fi
          echo "Frontend coverage: ${COVERAGE}% (threshold: ${THRESHOLD}%)"
          if awk "BEGIN {exit !($COVERAGE < $THRESHOLD)}"; then
            echo "::error::Frontend coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            exit 1
          fi

      - name: Build frontend
        working-directory: ./fe
        run: |
          echo "🏗️ Building frontend..."
          npm run build

  ############################################################################
  # Job 4: Build & Push Backend Image
  # Only runs if backend code changed AND tests pass
  ############################################################################
  build-backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    needs: [detect-changes, test-backend, test-integration, test-frontend]
    if: >-
      always() &&
      needs.detect-changes.outputs.backend == 'true' &&
      (needs.test-backend.result == 'success' || needs.test-backend.result == 'skipped') &&
      (needs.test-integration.result == 'success' || needs.test-integration.result == 'skipped') &&
      (needs.test-frontend.result == 'success' || needs.test-frontend.result == 'skipped')
    outputs:
      image_tag: ${{ steps.set_tag.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=dev

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./be
          file: ./be/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.BACKEND_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.BACKEND_IMAGE }}:buildcache,mode=max

      - name: Set build tag output
        id: set_tag
        run: echo "tag=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

  ############################################################################
  # Job 5: Build & Push Frontend Image
  # Only runs if frontend code changed AND lint/build pass
  ############################################################################
  build-frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    needs: [detect-changes, test-backend, test-integration, test-frontend]
    if: >-
      always() &&
      needs.detect-changes.outputs.frontend == 'true' &&
      (needs.test-backend.result == 'success' || needs.test-backend.result == 'skipped') &&
      (needs.test-integration.result == 'success' || needs.test-integration.result == 'skipped') &&
      (needs.test-frontend.result == 'success' || needs.test-frontend.result == 'skipped')
    outputs:
      image_tag: ${{ steps.set_tag.outputs.tag }}
    env:
      # The checkout UI ships only when the repository variable is exactly 'true'. The same value
      # labels the image, and release.sh refuses a frontend that disagrees with the backend's
      # payment flag from the server's .env (ADR-0003, "Turning payments on or off").
      VITE_FEATURE_PAYMENTS: ${{ vars.VITE_FEATURE_PAYMENTS == 'true' && 'true' || 'false' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=dev

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./fe
          file: ./fe/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            com.cursopus.feature-payments=${{ env.VITE_FEATURE_PAYMENTS }}
          cache-from: type=registry,ref=${{ env.FRONTEND_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.FRONTEND_IMAGE }}:buildcache,mode=max
          # A secret mount, not a build-arg: mode=max above pushes the builder's layers.
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}

          # IMPORTANT: VITE_API_BASE_URL build arg
          # This should match the server's public IP/domain.
          # If not set, docker-compose.yml will use the default.
          # For production deploys, consider making this configurable via GitHub Secret.
          #
          # VITE_FEATURE_PAYMENTS comes from the job env above, never straight from a
          # variable, so the bundle and the image label cannot disagree. Keep any
          # comment out of the block: its lines are build-args, not YAML.
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL || '/api/v1' }}
            VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN || '' }}
            VITE_SENTRY_RELEASE=${{ github.sha }}
            VITE_FEATURE_SENTRY=${{ vars.VITE_FEATURE_SENTRY == 'true' && 'true' || 'false' }}
            VITE_FEATURE_GA4=${{ vars.VITE_FEATURE_GA4 == 'true' && 'true' || 'false' }}
            VITE_GA4_MEASUREMENT_ID=${{ vars.VITE_GA4_MEASUREMENT_ID || '' }}
            VITE_FEATURE_POSTHOG=${{ vars.VITE_FEATURE_POSTHOG == 'true' && 'true' || 'false' }}
            VITE_POSTHOG_KEY=${{ vars.VITE_POSTHOG_KEY || '' }}
            VITE_POSTHOG_HOST=${{ vars.VITE_POSTHOG_HOST || '' }}
            VITE_FEATURE_PAYMENTS=${{ env.VITE_FEATURE_PAYMENTS }}
            VITE_FEATURE_EMAIL_NOTIFICATIONS=${{ secrets.VITE_FEATURE_EMAIL_NOTIFICATIONS || 'true' }}
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}

      - name: Set build tag output
        id: set_tag
        run: echo "tag=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

  ############################################################################
  # Job 6: Deploy to Server
  # Always runs after builds complete (or are skipped)
  # Updates docker-compose.yml image tags and restarts containers
  # WILL NOT RUN if any test job fails (backend tests or frontend lint/build)
  ############################################################################
  deploy:
    name: Deploy to Hetzner Server
    runs-on: ubuntu-latest
    needs: [detect-changes, test-backend, test-integration, test-frontend, build-backend, build-frontend]

    # Run even if build jobs were skipped (e.g., no changes)
    # This allows manual re-deploys via workflow_dispatch
    # Tests must pass if they ran - if any test fails, NO DEPLOYMENT
    if: always() &&
        (needs.test-backend.result == 'success' || needs.test-backend.result == 'skipped') &&
        (needs.test-integration.result == 'success' || needs.test-integration.result == 'skipped') &&
        (needs.test-frontend.result == 'success' || needs.test-frontend.result == 'skipped') &&
        (needs.build-backend.result == 'success' || needs.build-backend.result == 'skipped') &&
        (needs.build-frontend.result == 'success' || needs.build-frontend.result == 'skipped')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Prepare immutable release inputs
        id: release
        env:
          BACKEND_TAG: ${{ needs.build-backend.outputs.image_tag }}
          FRONTEND_TAG: ${{ needs.build-frontend.outputs.image_tag }}
        run: |
          backend=""; frontend=""
          if [ -n "$BACKEND_TAG" ]; then backend="${BACKEND_IMAGE}:$BACKEND_TAG"; fi
          if [ -n "$FRONTEND_TAG" ]; then frontend="${FRONTEND_IMAGE}:$FRONTEND_TAG"; fi
          {
            echo "backend=$backend"
            echo "frontend=$frontend"
            echo "base_hash=$(sha256sum docker-compose.yml | cut -d' ' -f1)"
            echo "caddy_hash=$(sha256sum Caddyfile | cut -d' ' -f1)"
            if [ -n "$backend$frontend" ]; then echo 'changed=true'; else echo 'changed=false'; fi
          } >> "$GITHUB_OUTPUT"

      # Documentation-only runs remain successful no-ops. An untouched service
      # keeps its actual immutable live digest, never a mutable dev fallback.
      - name: Release preflight (read-only)
        if: steps.release.outputs.changed == 'true'
        env:
          RELEASE_SHA: ${{ github.sha }}
          BASE_HASH: ${{ steps.release.outputs.base_hash }}
          CADDY_HASH: ${{ steps.release.outputs.caddy_hash }}
        run: |
          # Client-side release values are validated by the remote helper.
          # shellcheck disable=SC2029
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "bash -s -- preflight '$RELEASE_SHA' '$BASE_HASH' '$CADDY_HASH'" < .github/scripts/release.sh

      - name: Copy scoped release artifacts
        if: steps.release.outputs.changed == 'true'
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          remote="jobber/releases/ci-$RELEASE_SHA"
          # Client-side release values are validated by the remote helper.
          # shellcheck disable=SC2029
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "umask 077; mkdir -p '$remote/docker-auth'; chmod 700 '$remote' '$remote/docker-auth'"
          scp .github/scripts/release.sh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:"$remote/release.sh"
          scp scripts/release/server-cleanup.sh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:"$remote/server-cleanup.sh"
          scp -r be/migrations ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:"$remote/"
          # Client-side release values are validated by the remote helper.
          # shellcheck disable=SC2029
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "chmod -R a+rX '$remote/migrations'"

      - name: Authenticate release-scoped image pull
        if: steps.release.outputs.changed == 'true'
        env:
          DOCKER_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          # Client-side release values are validated by the remote helper.
          # shellcheck disable=SC2029
          printf '%s' "$DOCKER_TOKEN" | ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "DOCKER_CONFIG=\$HOME/jobber/releases/ci-$RELEASE_SHA/docker-auth docker login -u '${{ secrets.DOCKERHUB_USERNAME }}' --password-stdin"

      - name: Drain, back up, restore-check and activate
        if: steps.release.outputs.changed == 'true'
        env:
          RELEASE_SHA: ${{ github.sha }}
          BASE_HASH: ${{ steps.release.outputs.base_hash }}
          CADDY_HASH: ${{ steps.release.outputs.caddy_hash }}
          BACKEND_REF: ${{ steps.release.outputs.backend }}
          FRONTEND_REF: ${{ steps.release.outputs.frontend }}
        run: |
          # Client-side release values are validated by the remote helper.
          # shellcheck disable=SC2029
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "bash jobber/releases/ci-$RELEASE_SHA/release.sh deploy '$RELEASE_SHA' '$BASE_HASH' '$CADDY_HASH' '$BACKEND_REF' '$FRONTEND_REF'"

      - name: Clear release-scoped registry session
        if: always() && steps.release.outputs.changed == 'true'
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          # Release ID intentionally expands locally; Docker HOME expands remotely.
          # shellcheck disable=SC2029
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "DOCKER_CONFIG=\$HOME/jobber/releases/ci-$RELEASE_SHA/docker-auth docker logout" >/dev/null

  ############################################################################
  # Post-Deployment Summary
  ############################################################################
  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [detect-changes, test-backend, test-integration, test-frontend, build-backend, build-frontend, deploy]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate summary
        run: |
          SHA_SHORT=$(git rev-parse --short ${{ github.sha }})

          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ needs.deploy.result == 'success' && '✅ Success' || (needs.deploy.result == 'skipped' && '⏭️ Skipped' || '❌ Failed') }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Quality Gates:" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Unit Tests | ${{ needs.test-backend.result == 'success' && '✅ Passed' || (needs.test-backend.result == 'skipped' && '⏭️ Skipped' || '❌ Failed') }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Integration Tests | ${{ needs.test-integration.result == 'success' && '✅ Passed' || (needs.test-integration.result == 'skipped' && '⏭️ Skipped' || '❌ Failed') }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Lint & Build | ${{ needs.test-frontend.result == 'success' && '✅ Passed' || (needs.test-frontend.result == 'skipped' && '⏭️ Skipped' || '❌ Failed') }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build & Deploy:" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | ${{ needs.build-backend.result == 'success' && '✅ Built & Deployed' || (needs.build-backend.result == 'skipped' && '⏭️ Skipped' || '❌ Failed') }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ${{ needs.build-frontend.result == 'success' && '✅ Built & Deployed' || (needs.build-frontend.result == 'skipped' && '⏭️ Skipped' || '❌ Failed') }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Image Tags:" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.BACKEND_IMAGE }}:${SHA_SHORT}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.FRONTEND_IMAGE }}:${SHA_SHORT}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "### Access URLs:" >> $GITHUB_STEP_SUMMARY
            echo "- 🌐 Application: http://${{ secrets.SERVER_HOST }}" >> $GITHUB_STEP_SUMMARY
            echo "- 🔧 API: http://${{ secrets.SERVER_HOST }}:8080/api/v1" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.test-backend.result }}" == "failure" ] || [ "${{ needs.test-frontend.result }}" == "failure" ]; then
            echo "### 🚫 Deployment Blocked" >> $GITHUB_STEP_SUMMARY
            echo "Quality gates failed. Deployment was prevented to protect production." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ Deployment Failed" >> $GITHUB_STEP_SUMMARY
            echo "Check the deployment logs for details. Rollback may have been attempted automatically." >> $GITHUB_STEP_SUMMARY
          fi

################################################################################
# ROLLBACK PROCEDURE
################################################################################
#
# The release helper restores immutable old images automatically on failure.
# At clean schema50 it mounts the isolated through50 source; at clean51 it mounts
# the full through51 source read-only at /app/migrations. The51 source is never
# mounted at50 before a verified backup. Never down/force the DB.
# Dirty/unreadable/unexpected schemas keep entry closed for operator recovery.
# A healthy release keeps the five newest verified dumps and prunes older CI dumps.
# Base Compose/Caddy/.env remain unchanged; only the image override is promoted.
#
################################################################################
# REQUIRED GITHUB SECRETS
################################################################################
#
# You must configure these secrets in your GitHub repository:
# Settings → Secrets and variables → Actions → New repository secret
#
#   DOCKERHUB_USERNAME    - Your Docker Hub username
#   DOCKERHUB_TOKEN       - Docker Hub access token (not password!)
#                           Create at: https://hub.docker.com/settings/security
#                           Used for: Image push/pull authentication
#
#   SSH_PRIVATE_KEY       - Private SSH key for server access
#                           Generate: ssh-keygen -t ed25519 -C "github-actions"
#                           Add public key to server: ~/.ssh/authorized_keys
#                           Note: The private key is handled by ssh-agent (never written to disk)
#
#   SERVER_HOST           - Server IP or domain (e.g., 1.2.3.4 or app.example.com)
#   SERVER_USER           - SSH username (e.g., root, ubuntu, or deploy)
#                           Recommendation: Use dedicated deploy user, not root
#
#   VITE_API_BASE_URL     - (Optional) API URL for frontend build
#                           Example: http://65.108.123.45:8080/api/v1
#                           If not set, uses docker-compose.yml default
#
#   SENTRY_AUTH_TOKEN     - (Optional) Organization token for the source map upload.
#                           Reaches the build as a BuildKit secret. If not set, no
#                           source maps are built and the stack traces stay minified
#
# Repository variables (Settings → Secrets and variables → Actions → Variables). All
# of these end up in the public bundle; anything but exactly 'true' turns a flag off:
#
#   VITE_FEATURE_PAYMENTS, VITE_FEATURE_SENTRY, VITE_FEATURE_GA4, VITE_FEATURE_POSTHOG
#   VITE_SENTRY_DSN, VITE_GA4_MEASUREMENT_ID, VITE_POSTHOG_KEY, VITE_POSTHOG_HOST
#
# Application/runtime secrets (JWT, DB, S3, Resend, Anthropic, Creem, …) are NOT
# needed here: they live only in ~/jobber/.env on the server, which this
# workflow reads nothing from and never writes.
#
################################################################################
#
# SECURITY IMPROVEMENTS IN THIS VERSION:
#
# ✅ SSH private key never written to disk (uses ssh-agent)
# ✅ StrictHostKeyChecking enabled (uses known_hosts)
# ✅ Docker Hub authentication on server for private repos
# ✅ Automatic rollback to the compose snapshot taken before the new files land
# ✅ Pre-deploy database dump, the five newest kept
# ✅ Health checks with timeout before marking deployment successful
# ✅ Smoke tests verify critical endpoints
# ✅ Concurrency control prevents simultaneous deployments
# ✅ No deprecated Docker Compose syntax
#
################################################################################
